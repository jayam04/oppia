name: Commit PNG Files as WALL·E 🤖

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name to commit to (e.g. main, develop, feature/imgs)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:

  build:
    name: Build the app, and store build files as an artifact
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository so that local actions can be used
        uses: actions/checkout@v4
      - name: Merge develop and set up dependencies
        uses: ./.github/actions/merge-develop-and-set-up-dependencies
      - name: Generate build files
        uses: ./.github/actions/generate-build-files
  acceptance_test_with_python_installation:
    needs: [build]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
          - name: blog-admin/assign-and-remove-blog-editor-and-blog-admin-roles
          - name: blog-post-writer/register-and-update-blog-profile
          - name: blog-post-writer/create-and-edit-blog-post
        mobile: ["", "--mobile"]
        prod_env: ["", "--prod_env"]
    name: (${{ matrix.prod_env == '' && 'D' || 'P' }}${{ matrix.mobile == '' && 'D' || 'M'}}) (${{ matrix.suite.name }})
    steps:
      - name: Checkout repository so that local actions can be used
        uses: actions/checkout@v4
      - name: Merge develop and set up dependencies
        uses: ./.github/actions/merge-develop-and-set-up-dependencies
      - name: Generate build files
        uses: ./.github/actions/generate-build-files
      - name: Generate modified suite name for artifacts
        id: generate_suite_name_for_artifacts
        # Replace slashes in the filename with underscores.
        run: |
          SUITE_NAME=${{ matrix.suite.name }}
          echo "MODIFIED_SUITE_NAME=${SUITE_NAME//\//_}" >> $GITHUB_OUTPUT
      - name: Run Desktop Acceptance Test ${{ matrix.suite.name }}
        # TODO(#22448): Remove once all suites are fixed.
        if: ${{ steps.check_skip.outputs.SKIP_SUITE != 'true' }}
        run: >
          set -o pipefail;
          VIDEO_RECORDING_IS_ENABLED=1
          xvfb-run -a --server-args="-screen 0, 1920x1080x24"
          python -m scripts.run_acceptance_tests
          --suite=${{ matrix.suite.name }} ${{ matrix.prod_env }} ${{ matrix.mobile }}
          | tee desktop_acceptance_test_${{ steps.generate_suite_name_for_artifacts.outputs.MODIFIED_SUITE_NAME }}.log
      - name: Upload PNG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pngs-${{ matrix.suite }}-${{ matrix.mobile }}-${{ matrix.prod_env }}
          path: '*.png'

  commit_pngs:
    runs-on: ubuntu-latest
    needs: acceptance_test_with_python_installation

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Download all PNG artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pngs-*
          merge-multiple: true  # Merge all artifacts into the current directory

      - name: Configure Git as WALL·E
        run: |
          git config --global user.name "walle"
          git config --global user.email "walle@jayampatel.space"

      - name: Commit and push PNG files as WALL·E 🤖
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: |
          git add '*.png'
          if git diff --cached --quiet; then
            echo "No PNG changes to commit."
            exit 0
          fi
          git commit -m "Auto-commit PNG files — powered by hardworking WALL·E 🤖"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} HEAD:${{ inputs.branch }}
